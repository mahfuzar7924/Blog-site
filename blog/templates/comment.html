<div class="comment">
    <div class="comment-head">
        <strong>{{ variable.author.username|default:"Anonymous" }}</strong>
        &middot; {{ variable.created_at|date:"M d, Y H:i" }}
    </div>
    <p>{{ variable.body }}</p>

    {% if variable.replies.exists %}
        <div class="replies">
            {% for reply in variable.replies.all %}
                {% include 'comment.html' with variable=reply %}
            {% endfor %}
        </div>
    {% endif %}
</div>
